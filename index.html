<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lightyorugami/legacylauncher-help/refs/heads/main/icon.png">
<title>Legacy Project | Perk Tree</title>
<style>
:root {
  --bg:#060b0e;
  --panel:#0b1216;
  --line:#617278;
  --cyan:#67c7c7;
  --cyan2:#8ae1dc;
  --terror:#8b2836;
  --terror-hi:#d04a5d;
  --text:#edf4f4;
  --muted:#91a3a8;
  --node:54px;
}
* { box-sizing:border-box; }
html, body { width:100%; height:100%; margin:0; }
body {
  overflow:hidden;
  font-family:Inter, "Segoe UI", Arial, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 50%, rgba(104,31,6,.72), transparent 55%),
    radial-gradient(circle at 13% 58%, rgba(177,73,22,.16), transparent 36%),
    radial-gradient(circle at 83% 42%, rgba(54,72,78,.68), transparent 60%),
    radial-gradient(circle at 89% 40%, rgba(94,137,147,.14), transparent 38%),
    linear-gradient(120deg,var(--background-base-left, #110a07) 0%,var(--background-base-middle, #0a0e10) 53%,var(--background-base-right, #090f12) 100%);
}
/* Subtle floating dust, independent of the fixed background gradient. */
#ambientDust {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.app {
  position:relative;
  z-index:1;
  height:100vh;
  display:grid;
  grid-template-rows:86px 1fr;
  padding:18px 28px 18px;
}
.topbar {
  position:relative;
  top:9px;
  display:flex;
  /* Align the title with the ID selection bar, not with the status below. */
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  max-width:1500px;
  width:100%;
  margin:0 auto;
}
.brand {
  display:flex;
  align-items:center;
  min-height:54px;
  gap:16px;
  white-space:nowrap;
}
.brand h1 {
  margin:0;
  font-size:39px;
  line-height:1;
  font-weight:300;
  letter-spacing:.24em;
  text-transform:uppercase;
}
.brand .subtitle {
  color:var(--muted);
  font-size:13px;
  letter-spacing:.12em;
}
.tabs {
  position:relative;
  display:flex;
  gap:8px;
  align-self:flex-end;
  padding:7px 9px;
  min-width:530px;
  background:#0e2229;
  border:1px solid rgba(95,122,129,.26);
  border-radius:14px;
  box-shadow:
    inset 0 1px 0 rgba(140,176,186,.06),
    inset 0 -1px 0 rgba(0,0,0,.42),
    0 10px 30px rgba(0,0,0,.22);
}
.tabs::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(18,38,45,.45);
}
.tree-tab {
  position:relative;
  border:1px solid transparent;
  background:transparent;
  color:#9badb2;
  min-width:66px;
  height:38px;
  padding:0 14px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  letter-spacing:.06em;
  cursor:pointer;
  transition:.16s ease;
}
.topbar-right {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:7px;
  min-width:530px;
}
.rotation-status {
  min-height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  width:100%;
  padding:0 10px;
  color:#8da2a7;
  font-size:12px;
  letter-spacing:.01em;
  white-space:nowrap;
  text-shadow:0 0 6px rgba(0,0,0,.28);
}
.rotation-current {
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#aac3c8;
}
.rotation-current strong {
  color:#e4f6f5;
  font-weight:800;
}
.live-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#6fe0d2;
  box-shadow:0 0 10px rgba(111,224,210,.82);
}
.rotation-separator {
  color:#587076;
}
.rotation-countdown {
  color:#d8e6e7;
  font-variant-numeric:tabular-nums;
  font-weight:700;
}
.tree-tab.live-tree {
  position:relative;
}
.tree-tab.live-tree::after {
  content:"";
  position:absolute;
  top:6px;
  right:7px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#78e4d8;
  box-shadow:0 0 10px rgba(120,228,216,.95);
}
.tree-tab:hover {
  color:#f0ffff;
  background:rgba(95,170,173,.10);
  border-color:rgba(86,138,145,.16);
}
.tree-tab.active {
  color:#f6ffff;
  border-color:rgba(102,220,214,.62);
  background:linear-gradient(180deg, rgba(63,159,165,.30), rgba(24,78,87,.18));
  box-shadow:
    inset 0 0 0 1px rgba(142,244,236,.14),
    0 0 0 1px rgba(49,123,128,.28),
    0 0 16px rgba(76,199,194,.18);
}
.main {
  min-height:0;
  display:grid;
  grid-template-columns:1fr;
  place-items:center;
  max-width:1500px;
  width:100%;
  margin:0 auto;
}
.side {
  align-self:stretch;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.info-card {
  max-width:330px;
  padding:22px 22px 20px;
  border:1px solid rgba(122,150,156,.20);
  border-radius:14px;
  background:rgba(7,14,17,.58);
  backdrop-filter:blur(10px);
  box-shadow:0 20px 70px rgba(0,0,0,.20);
}
.info-card.right { margin-left:auto; }
.kicker {
  text-transform:uppercase;
  color:#75c6c3;
  letter-spacing:.18em;
  font-size:11px;
  font-weight:800;
}
.current-title {
  margin:7px 0 8px;
  font-size:31px;
  font-weight:350;
}
.info-card p {
  color:#9badb1;
  font-size:13px;
  line-height:1.55;
  margin:0;
}
.legend {
  display:grid;
  gap:10px;
  margin-top:18px;
}
.legend-row {
  display:flex;
  align-items:center;
  gap:10px;
  color:#aebdc0;
  font-size:12px;
}
.dot {
  width:10px;height:10px;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.dot.innocent { color:#67c7c7;background:#67c7c7; }
.dot.terror { color:#b44052;background:#b44052; }
.extra-warning {
  margin-top:16px;
  padding:10px 11px;
  border-radius:8px;
  border:1px solid rgba(198,158,80,.25);
  background:rgba(151,106,22,.08);
  color:#c8b37f;
  font-size:11px;
  line-height:1.45;
  display:none;
}
.extra-warning.visible { display:block; }

.tree-shell {
  width:600px;
  height:calc(100vh - 130px);
  max-height:880px;
  min-height:760px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tree-stage {
  position:relative;
  width:560px;
  height:850px;
  transform-origin:center center;
  overflow:visible;
  background:none !important;
  border:none;
  box-shadow:none;
  filter:none;
}
.tree-stage::before {
  content:none;
}

.tree-links {
  position:absolute;
  inset:0;
  width:560px;
  height:850px;
  overflow:visible;
  pointer-events:none;
  z-index:1;
}
.tree-links line {
  stroke:#71858a;
  stroke-width:3.2;
  stroke-opacity:.72;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}

.perk-node {
  position:absolute;
  width:var(--node);
  height:var(--node);
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #829193;
  background:#364a4d;
  padding:0;
  cursor:help;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 14px rgba(0,0,0,.42);
  transition:transform .14s ease, border-color .14s ease,
             box-shadow .14s ease, filter .14s ease;
  z-index:4;
}
.perk-node.terror {
  border-color:#829193;
  background:#2c1116;
}
.perk-icon-viewport {
  display:block;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
}
.perk-node img {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
  pointer-events:none;
  display:block;
  mix-blend-mode:screen;
}
.perk-node .fallback {
  display:none;
  width:100%;height:100%;
  align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#d6e8e8;
  text-align:center;
}
.perk-node:hover, .perk-node:focus-visible {
  transform:translate(-50%,-50%) scale(1.12);
  border-color:#829193;
  filter:brightness(1.14);
  box-shadow:0 0 22px rgba(93,224,216,.42);
  z-index:15;
  outline:none;
}
.perk-node.terror:hover, .perk-node.terror:focus-visible {
  border-color:#829193;
  box-shadow:0 0 22px rgba(216,66,88,.38);
}
.perk-id {
  position:absolute;
  right:-7px;
  bottom:-5px;
  min-width:19px;
  height:19px;
  padding:0 4px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0e2229;
  border:1px solid rgba(142,190,194,.45);
  color:#a7c8cb;
  font-size:9px;
  font-weight:800;
  z-index:2;
  pointer-events:none;
}
.tooltip {
  --arrow-y: 50%;
  position:fixed;
  z-index:1000;
  width:min(340px, calc(100vw - 28px));
  min-height:132px;
  padding:10px 13px 15px;
  border:2px solid #829193;
  border-radius:9px;
  background:linear-gradient(180deg,rgba(60,65,68,.96),rgba(47,52,56,.96));
  box-shadow:
    0 0 0 2px rgba(46,61,64,.96),
    0 0 0 4px rgba(133,175,183,.28),
    inset 0 0 0 2px rgba(190,214,219,.22),
    0 0 13px 2px rgba(152,205,212,.32),
    0 8px 28px rgba(0,0,0,.42);
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .12s ease, visibility .12s ease;
}
/* La petite pointe relie l'encadré à l'icône survolée. */
.tooltip::before, .tooltip::after {
  content:"";
  position:absolute;
  pointer-events:none;
  top:var(--arrow-y);
  transform:translateY(-50%);
  clip-path:polygon(0 50%, 100% 0, 100% 100%);
}
.tooltip::before {
  left:-11px;
  width:11px;
  height:14px;
  background:#829193;
}
.tooltip::after {
  left:-7px;
  width:9px;
  height:10px;
  background:#383e42;
}
.tooltip.arrow-right::before,
.tooltip.arrow-right::after {
  clip-path:polygon(100% 50%, 0 0, 0 100%);
}
.tooltip.arrow-right::before {left:auto;right:-11px;}
.tooltip.arrow-right::after {left:auto;right:-7px;}
.tooltip.arrow-none::before,.tooltip.arrow-none::after {display:none;}
.tooltip.visible {opacity:1;visibility:visible;}
.tip-head {margin:0 0 4px;}
.tip-name {
  font-size:18px;
  line-height:1.25;
  font-weight:450;
  color:#f1f4f5;
}
.tip-desc {
  margin:0;
  font-size:14px;
  color:#e0e5e6;
  line-height:1.30;
}
.helper {
  color:#6f8388;
  font-size:11px;
  line-height:1.55;
}
.key {
  display:inline-flex;
  min-width:22px;
  height:20px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  border:1px solid rgba(126,156,162,.30);
  background:#0a1417;
  color:#a9bbbf;
  font-size:10px;
  font-weight:700;
}
@media (max-height:930px) {
  .tree-stage { transform:scale(.91); }
  .tree-shell { max-height:790px; min-height:720px; }
}
@media (max-width:1050px) {
  body { overflow:auto; }
  .app { height:auto; min-height:100vh; }
  .tree-shell { margin:0 auto; }
  .topbar { flex-direction:column; height:auto; }
  .topbar-right { width:100%; min-width:0; align-items:stretch; }
  .tabs { min-width:0; width:100%; }
  .rotation-status { justify-content:center; flex-wrap:wrap; white-space:normal; min-width:0; }
  .app { grid-template-rows:auto 1fr; }
}
</style>
</head>
<body>
<canvas id="ambientDust" aria-hidden="true"></canvas>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Perk Tree</h1>
    </div>
    <div class="topbar-right">
      <nav class="tabs" aria-label="Choose a perk tree">
        <button class="tree-tab active" data-tree="2">ID2</button>
        <button class="tree-tab" data-tree="3">ID3</button>
        <button class="tree-tab" data-tree="6">ID6</button>
        <button class="tree-tab" data-tree="0">ID0</button>
        <button class="tree-tab" data-tree="5">ID5</button>
        <button class="tree-tab" data-tree="1">ID1</button>
        <button class="tree-tab" data-tree="4">ID4</button>
      </nav>
      <div class="rotation-status" aria-live="polite">
        <span class="rotation-current">
          <span class="live-dot"></span>
          Active: <strong id="activeTreeLabel">—</strong>
        </span>
        <span class="rotation-separator">•</span>
        <span id="selectedTreeSchedule">Calculating rotation…</span>
        <span class="rotation-countdown" id="rotationCountdown"></span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="tree-shell">
      <div class="tree-stage" id="treeStage" aria-label="Perk tree"></div>
    </section>
  </main>
</div>

<div class="tooltip" id="tooltip" role="tooltip">
  <div class="tip-head">
    <div class="tip-name" id="tipName"></div>
  </div>
  <p class="tip-desc" id="tipDesc"></p>
</div>

const stage = document.getElementById('treeStage');
const tooltip = document.getElementById('tooltip');
const tipName = document.getElementById('tipName');
const tipDesc = document.getElementById('tipDesc');
let currentTree = 2;
let activeNode = null;

// ICON ZOOM: 0 = original size, +1 = 15% larger, +2 = 30% larger.
const PERK_ICON_ZOOM = +1;

// BACKGROUND BRIGHTNESS: 0 = original dark background; each +1 adds 12
// to the RGB channels of ONLY the dark base gradient (not the orange/blue spots).
const BACKGROUND_BRIGHTNESS = +1;

function applyBackgroundBrightness() {
  const offset = BACKGROUND_BRIGHTNESS * 12;
  const color = (r, g, b) =>
    `rgb(${[r, g, b].map(channel => Math.max(0, Math.min(255, Math.round(channel + offset)))).join(', ')})`;
  const root = document.documentElement;
  root.style.setProperty('--background-base-left', color(17, 10, 7));
  root.style.setProperty('--background-base-middle', color(10, 14, 16));
  root.style.setProperty('--background-base-right', color(9, 15, 18));
}
applyBackgroundBrightness();


// ================================================================
// AUTOMATIC PERK TREE ROTATION
// MongoDB reference: 24/08/2026 05:00 UTC = ID3
// Rotation: 2 → 3 → 6 → 0 → 5 → 1 → 4 → 2 ...
// Period: 14 days
// ================================================================
const ROTATION_ORDER = [2, 3, 6, 0, 5, 1, 4];
const ROTATION_ANCHOR_TREE = 3;
const ROTATION_ANCHOR_UTC = Date.parse('2026-08-24T05:00:00.000Z');
const ROTATION_PERIOD_MS = 14 * 24 * 60 * 60 * 1000;

const activeTreeLabel = document.getElementById('activeTreeLabel');
const selectedTreeSchedule = document.getElementById('selectedTreeSchedule');
const rotationCountdown = document.getElementById('rotationCountdown');

function positiveMod(n, m) {
  return ((n % m) + m) % m;
}

function getRotationState(nowMs = Date.now()) {
  const anchorIndex = ROTATION_ORDER.indexOf(ROTATION_ANCHOR_TREE);

  // The page is intended for the 2026+ schedule, but keeping this
  // calculation reversible also makes historical dates deterministic.
  const cycle = Math.floor((nowMs - ROTATION_ANCHOR_UTC) / ROTATION_PERIOD_MS);
  const activeIndex = positiveMod(anchorIndex + cycle, ROTATION_ORDER.length);
  const activeTree = ROTATION_ORDER[activeIndex];
  const activeSince = ROTATION_ANCHOR_UTC + cycle * ROTATION_PERIOD_MS;
  const nextChange = activeSince + ROTATION_PERIOD_MS;

  return { cycle, activeIndex, activeTree, activeSince, nextChange };
}

function nextActivationForTree(treeId, nowMs = Date.now()) {
  const state = getRotationState(nowMs);

  // If the selected tree is active now, return its next future
  // occurrence after the current active period (one full 7-tree cycle).
  if (treeId === state.activeTree) {
    return state.activeSince + ROTATION_PERIOD_MS * ROTATION_ORDER.length;
  }

  for (let steps = 1; steps <= ROTATION_ORDER.length; steps++) {
    const index = (state.activeIndex + steps) % ROTATION_ORDER.length;
    if (ROTATION_ORDER[index] === treeId) {
      return state.activeSince + steps * ROTATION_PERIOD_MS;
    }
  }

  return null;
}

function formatLocalDateTime(timestamp) {
  const d = new Date(timestamp);
  return new Intl.DateTimeFormat(undefined, {
    day:'2-digit',
    month:'2-digit',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit'
  }).format(d);
}

function formatCountdown(ms) {
  if (ms <= 0) return '00j 00h 00m 00s';

  const totalSeconds = Math.floor(ms / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const pad = n => String(n).padStart(2, '0');
  return `${days}j ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
}

function updateRotationDisplay() {
  const now = Date.now();
  const state = getRotationState(now);

  activeTreeLabel.textContent = `ID${state.activeTree}`;

  document.querySelectorAll('.tree-tab').forEach(btn => {
    const id = Number(btn.dataset.tree);
    btn.classList.toggle('live-tree', id === state.activeTree);
  });

  if (currentTree === state.activeTree) {
    selectedTreeSchedule.textContent =
      `ID${currentTree} is active · next change: ${formatLocalDateTime(state.nextChange)}`;
    rotationCountdown.textContent =
      `(${formatCountdown(state.nextChange - now)})`;
  } else {
    const nextActivation = nextActivationForTree(currentTree, now);
    selectedTreeSchedule.textContent =
      `ID${currentTree} next active: ${formatLocalDateTime(nextActivation)}`;
    rotationCountdown.textContent =
      `(${formatCountdown(nextActivation - now)})`;
  }
}


function escapeHtml(s) {
  return String(s)
    .replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;');
}

function renderTree(id) {
  currentTree = Number(id);
  const tree = TREES[String(currentTree)];

  // Keep the first (topmost) perk at exactly the same on-screen position
  // in every tree; shift its connected nodes and lines together.
  const FIRST_PERK_POSITION = { x:280, y:69 };
  const firstPerk = tree.items.reduce((top, perk) =>
    perk.y < top.y ? perk : top, tree.items[0]);
  const dx = FIRST_PERK_POSITION.x - firstPerk.x;
  const dy = FIRST_PERK_POSITION.y - firstPerk.y;
  const positionedItems = tree.items.map(perk => ({
    ...perk, x:perk.x + dx, y:perk.y + dy
  }));

  document.querySelectorAll('.tree-tab').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.tree) === currentTree);
  });

  updateRotationDisplay();

  stage.innerHTML = '';
  stage.style.backgroundImage = 'none';

  // Liaisons vectorielles propres : plus aucun fond raster, aucun cadre,
  // aucun artefact. Les lignes sont calculées à partir de la géométrie
  // réelle des cercles de chaque arbre.
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.classList.add('tree-links');
  svg.setAttribute('viewBox', '0 0 560 850');
  svg.setAttribute('aria-hidden', 'true');

  // Regrouper les perks par rangée.
  const rows = [];
  [...positionedItems]
    .sort((a,b) => a.y - b.y || a.x - b.x)
    .forEach(item => {
      let row = rows.find(r => Math.abs(r.y - item.y) < 12);
      if (!row) {
        row = { y:item.y, items:[] };
        rows.push(row);
      }
      row.items.push(item);
      row.y = row.items.reduce((s,p) => s + p.y, 0) / row.items.length;
    });
  rows.sort((a,b) => a.y - b.y);
  rows.forEach(r => r.items.sort((a,b) => a.x - b.x));

  // Deux cercles de rangées voisines sont reliés lorsqu'ils sont
  // verticalement alignés ou voisins immédiats. Cela reproduit le
  // maillage des arbres sans récupérer le bruit graphique des captures.
  const MAX_DX = 118;

  for (let r = 0; r < rows.length - 1; r++) {
    const upper = rows[r].items;
    const lower = rows[r + 1].items;
    const connected = new Set();

    upper.forEach((a, ai) => {
      lower.forEach((b, bi) => {
        if (Math.abs(a.x - b.x) <= MAX_DX) {
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('x1', a.x);
          line.setAttribute('y1', a.y);
          line.setAttribute('x2', b.x);
          line.setAttribute('y2', b.y);
          svg.appendChild(line);
          connected.add('u' + ai);
          connected.add('l' + bi);
        }
      });
    });

    // Sécurité : aucun cercle ne doit rester isolé de la rangée voisine.
    upper.forEach((a, ai) => {
      if (!connected.has('u' + ai)) {
        const b = lower.reduce((best, p) =>
          Math.abs(p.x-a.x) < Math.abs(best.x-a.x) ? p : best, lower[0]);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', a.x);
        line.setAttribute('y1', a.y);
        line.setAttribute('x2', b.x);
        line.setAttribute('y2', b.y);
        svg.appendChild(line);
      }
    });

    lower.forEach((b, bi) => {
      if (!connected.has('l' + bi)) {
        const a = upper.reduce((best, p) =>
          Math.abs(p.x-b.x) < Math.abs(best.x-b.x) ? p : best, upper[0]);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', a.x);
        line.setAttribute('y1', a.y);
        line.setAttribute('x2', b.x);
        line.setAttribute('y2', b.y);
        svg.appendChild(line);
      }
    });
  }

  stage.appendChild(svg);

  positionedItems.forEach(perk => {
    const node = document.createElement('button');
    node.type = 'button';
    node.className = 'perk-node ' + (perk.role === 'Terror' ? 'terror' : 'innocent');
    node.style.left = perk.x + 'px';
    node.style.top = perk.y + 'px';
    node.dataset.id = perk.id;
    node.dataset.name = perk.name;
    node.dataset.role = perk.role;
    node.dataset.description = perk.description;
    node.setAttribute('aria-label', `${perk.name} — ${perk.description}`);

    const img = document.createElement('img');
    if (perk.icon) {
      img.src = perk.icon;
      img.alt = perk.name;
      img.referrerPolicy = 'no-referrer';
    }
    // Magnify only the icon, not the circle or its ID badge.
    img.style.transform = `scale(${1 + PERK_ICON_ZOOM * 0.15})`;

    const fallback = document.createElement('span');
    fallback.className = 'fallback';
    fallback.textContent = perk.id;

    img.addEventListener('error', () => {
      img.style.display = 'none';
      fallback.style.display = 'flex';
    });

    const badge = document.createElement('span');
    badge.className = 'perk-id';
    badge.textContent = perk.id;

    const iconViewport = document.createElement('span');
    iconViewport.className = 'perk-icon-viewport';
    iconViewport.append(img, fallback);
    node.append(iconViewport, badge);

    node.addEventListener('mouseenter', () => showTooltip(node));
    node.addEventListener('mouseleave', hideTooltip);
    node.addEventListener('focus', () => showTooltip(node));
    node.addEventListener('blur', hideTooltip);

    stage.appendChild(node);
  });

}

function showTooltip(node) {
  activeNode = node;
  tipName.textContent = node.dataset.name;
  tipDesc.textContent = node.dataset.description;
  tooltip.classList.add('visible');
  positionTooltip(node);
}

function positionTooltip(node) {
  if (!node) return;
  const rect = node.getBoundingClientRect();
  const gap = 13;
  const margin = 14;
  const maxWidth = 340;
  const roomRight = window.innerWidth - rect.right - gap - margin;
  const roomLeft = rect.left - gap - margin;

  tooltip.classList.remove('arrow-right', 'arrow-none');
  tooltip.style.width = '';
  // Sur les fenêtres étroites, placer la bulle sous la perk si aucun
  // côté ne permet de conserver une largeur confortable.
  const below = Math.max(roomLeft, roomRight) < 230;
  let x;
  let y;
  if (below) {
    tooltip.classList.add('arrow-none');
    tooltip.style.width = Math.min(maxWidth, window.innerWidth - 2 * margin) + 'px';
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    x = Math.max(margin, Math.min(rect.left + rect.width / 2 - width / 2,
                                  window.innerWidth - width - margin));
    y = rect.bottom + gap;
    if (y + height > window.innerHeight - margin) y = rect.top - height - gap;
  } else {
    const leftSide = roomRight < maxWidth && roomLeft > roomRight;
    if (leftSide) tooltip.classList.add('arrow-right');
    const available = leftSide ? roomLeft : roomRight;
    tooltip.style.width = Math.min(maxWidth, available) + 'px';
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    x = leftSide ? rect.left - gap - width : rect.right + gap;
    const centerY = rect.top + rect.height / 2;
    y = Math.max(margin, Math.min(centerY - height / 2,
                                   window.innerHeight - height - margin));
    // La pointe reste alignée sur la perk, même si la bulle est
    // décalée pour ne pas sortir du haut ou du bas de l'écran.
    const arrowY = Math.max(14, Math.min(centerY - y, height - 14));
    tooltip.style.setProperty('--arrow-y', arrowY + 'px');
  }
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  activeNode = null;
  tooltip.classList.remove('visible');
}

window.addEventListener('resize', () => positionTooltip(activeNode));
window.addEventListener('scroll', () => positionTooltip(activeNode), true);

document.querySelectorAll('.tree-tab').forEach(btn => {
  btn.addEventListener('click', () => renderTree(btn.dataset.tree));
});

const TREE_ORDER = [2, 3, 6, 0, 5, 1, 4];

document.addEventListener('keydown', e => {
  const idx = TREE_ORDER.indexOf(currentTree);

  if (e.key === 'ArrowRight') {
    const next = TREE_ORDER[(idx + 1) % TREE_ORDER.length];
    renderTree(next);
  } else if (e.key === 'ArrowLeft') {
    const prev = TREE_ORDER[(idx - 1 + TREE_ORDER.length) % TREE_ORDER.length];
    renderTree(prev);
  }
});

renderTree(getRotationState().activeTree);
updateRotationDisplay();
setInterval(updateRotationDisplay, 1000);

// Slow, irregular dust: random positions, drifting paths and smooth fade-in/out.
// These settings affect ONLY the dust, not the orange / blue glows.
const DUST_OPACITY = 0.16;   // Try 0.12 for fainter particles.
const DUST_DENSITY = 1.0;   // 1 = normal amount of dust.

(function initAmbientDust() {
  const canvas = document.getElementById('ambientDust');
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI * 2;
  let width = 0, height = 0, motes = [], last = 0, frame = 0;
  const between = (min, max) => min + Math.random() * (max - min);

  function newMote(randomAge = true) {
    const life = between(9, 26);
    return {
      x: between(0, width), y: between(0, height),
      size: between(1.15, 2.7),
      vx: between(-4.5, 4.5), vy: between(-8.5, 3),
      phase: between(0, TAU), sway: between(0.28, 0.85),
      age: randomAge ? between(0, life) : 0,
      life, strength: between(0.45, 1)
    };
  }

  function resize() {
    const oldW = width, oldH = height;
    width = window.innerWidth;
    height = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(14, Math.min(145,
      Math.round(width * height / 18000 * Math.max(0, DUST_DENSITY))));
    if (oldW && oldH) {
      motes.forEach(m => { m.x *= width / oldW; m.y *= height / oldH; });
    }
    if (motes.length > count) motes.length = count;
    while (motes.length < count) motes.push(newMote());
    paint();
  }

  function paint() {
    ctx.clearRect(0, 0, width, height);
    for (const m of motes) {
      // Each mote emerges from darkness, wanders, then disappears.
      const fadeIn = Math.min(1, m.age / 2.5);
      const fadeOut = Math.min(1, (m.life - m.age) / 3.5);
      const envelope = Math.max(0, fadeIn * fadeOut);
      const opacity = Math.min(0.35, DUST_OPACITY * m.strength * envelope);
      if (opacity < 0.003) continue;
      const rgb = m.x < width * 0.46 ? '222,202,181' : '195,212,219';
      // Slightly blurry specks, without strong stars or sharp white dots.
      const glow = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.size * 2.6);
      glow.addColorStop(0, `rgba(${rgb},${opacity})`);
      glow.addColorStop(0.42, `rgba(${rgb},${opacity * 0.45})`);
      glow.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size * 2.6, 0, TAU);
      ctx.fill();
    }
  }

  function animate(now) {
    frame = requestAnimationFrame(animate);
    if (document.hidden || reduceMotion.matches) {
      last = now;
      return;
    }
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.07);
    last = now;
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.age += dt;
      if (m.age >= m.life || m.x < -25 || m.x > width + 25 ||
          m.y < -25 || m.y > height + 25) {
        motes[i] = newMote(false);
        continue;
      }
      // A tiny changing sway means particles never move in parallel straight lines.
      m.x += (m.vx + Math.sin(m.age * m.sway + m.phase) * 3.2) * dt;
      m.y += (m.vy + Math.cos(m.age * m.sway * .65 + m.phase) * 1.6) * dt;
    }
    paint();
  }

  window.addEventListener('resize', resize, { passive:true });
  reduceMotion.addEventListener?.('change', () => {
    last = 0;
    paint();
  });
  resize();
  frame = requestAnimationFrame(animate);
})();

</script>
